<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Users</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<h1>User List</h1>
	<a th:href="@{/users/create}" class="btn-add">Add User</a>
	<table border="1">
		<tr>
			<th>ID</th>
			<th>Name</th>
			<th>Email</th>
			<th>Actions</th>
		</tr>
		<tr th:each="user : ${users}">
			<td th:text="${user.id}">1</td>
			<td th:text="${user.name}">Name</td>
			<td th:text="${user.email}">Email</td>
			<td>
				<a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn-edit">Edit</a>
				<a th:href="@{/users/delete/{id}(id=${user.id})}" class="btn-delete">Delete</a>
			</td>
		</tr>
	</table>
</body>

</html>
